<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e4dd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="占卜">
<title>Divination</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#e8e4dd;--card:#f3f0e9;--text:#263735;--muted:#53615b;--accent:#3e5b63;--button-text:#f3f0e9;--border:#b4b5aa;--warning:#a43428;--sel:var(--accent)}
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.55;background:var(--bg);color:var(--text);min-height:100dvh}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card)}button:disabled{opacity:.5;cursor:default}button:active:not(:disabled){opacity:.7}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--text);outline-offset:3px}input,select{padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--card);min-width:0;max-width:100%}#app-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}#brand-name{font-size:24px;margin:0}#workspace{display:flex;flex-direction:column;gap:18px}#navigation{min-width:0}#mobilebar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tab{padding:9px 2px;font-size:clamp(11px,2.9vw,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;width:100%}.tab.sel{background:var(--accent);color:var(--button-text);border-color:var(--accent)}.nav-empty{min-height:44px}#configuration{display:flex;flex-direction:column;gap:14px;min-width:0;padding:16px;background:var(--card);border-radius:16px}#subbar{display:none;gap:6px;flex-wrap:wrap}#subrow{display:flex;gap:6px;flex-wrap:wrap}#subbar .tab{width:auto;padding:8px 12px}.chk{display:flex;align-items:center;gap:6px}#liurow{display:none;flex-direction:column;gap:10px}.liu-trigram-row,.liu-moving-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.moving-options{display:flex;gap:8px;flex-wrap:wrap}.moving-options label{display:flex;align-items:center;gap:4px;min-height:44px}#focusrow,#traditionalrow{display:none;flex-direction:column;gap:10px;align-items:stretch}#focusrow label,#traditionalrow label{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#traditionalrow .almanac-topic,#traditionalrow .almanac-dates{display:flex;gap:10px;flex-wrap:wrap}#inrow{display:flex;flex-direction:column;gap:6px}#q{width:100%;min-height:64px}#btnrow{display:flex;gap:8px;flex-wrap:wrap}#go{flex:1;background:var(--accent);color:var(--button-text);border-color:var(--accent)}#reading{min-width:0;display:flex;flex-direction:column;gap:14px}#method-title{font-size:22px;margin:0}#out{min-height:160px;word-break:break-word;user-select:text}#out:empty::before{content:attr(data-empty);display:block;padding:36px 16px;text-align:center;color:var(--muted)}.result-block{padding:16px;background:var(--card);border-radius:12px;margin-bottom:12px}.result-block h3{margin:0 0 10px;font-size:18px;line-height:1.5}.result-text,.result-meta{white-space:pre-wrap;line-height:1.8}.result-text{overflow-wrap:anywhere}#resulttools{display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg);position:sticky;bottom:0}#copy{margin-left:auto;background:var(--accent);color:var(--button-text);border-color:var(--accent)}.b{font-weight:600}.i{font-style:italic}.red,.warn,#special-code-error{color:var(--warning)}.big{font-size:1.15em}.palace-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:14px 0}.palace{padding:10px;min-height:125px;background:var(--card);font-size:13px}.palace h3{margin:0 0 8px;font-size:14px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:10;padding:16px}.modal-box{background:var(--bg);border:1px solid var(--border);border-radius:16px;width:100%;max-width:760px;max-height:85dvh;display:flex;flex-direction:column;padding:20px;gap:12px}.modal-box h3{margin:0}.modal-body{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-word;line-height:1.8;background:var(--card);padding:16px;border-radius:12px;min-height:100px}.modal-btns{display:flex;gap:8px;flex-wrap:wrap}.modal-btns .modal-close{margin-left:auto}#special-code{width:100%}#closing-notice .modal-body{min-height:0}#toast{position:fixed;left:50%;bottom:15%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;background:var(--accent);color:var(--button-text);opacity:0;pointer-events:none;z-index:99;transition:opacity .2s}#toast.show{opacity:1}
@media(min-width:900px) and (orientation:landscape){body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}#workspace{flex:1;min-height:0;display:grid;grid-template-columns:180px 290px minmax(0,1fr);gap:18px}#navigation,#configuration{overflow-y:auto}#mobilebar{display:flex;flex-direction:column;gap:6px}.nav-empty{display:none}.tab{font-size:15px;text-align:left;padding:10px 12px}#reading{min-height:0}#out{overflow-y:auto;flex:1;padding-right:5px}#resulttools{position:static}}
@media(prefers-color-scheme:dark){:root{--bg:#101b17;--card:#182a22;--text:#e8e4dd;--muted:#c5c1b9;--accent:#214b3a;--border:#53685c;--warning:#f5b6a9}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.reading-card{border-bottom:1px solid var(--border);padding:18px 0}.reading-card strong{display:block;font-size:18px;margin-bottom:8px}.reading-card p{white-space:pre-wrap;line-height:1.8;margin:0}.rune-row{display:flex;gap:18px;align-items:flex-start}.rune-symbol{font-size:68px;min-width:82px;line-height:1.4;text-align:center}.rune-row>div:last-child{flex:1}.rune-symbol.reversed{transform:rotate(180deg)}.rune-symbol.blank{border:1px solid var(--border);border-radius:6px;width:56px;min-width:56px;height:76px;margin:10px 13px}.palace summary{cursor:pointer;min-height:110px;list-style:none;display:block}.palace summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.palace dl{display:grid;grid-template-columns:auto 1fr;gap:8px}.palace dd{margin:0;text-align:right}.palace-number{font-size:28px}.active-palace{background:var(--accent);color:var(--button-text)}.hexagram-three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0;text-align:center}.hexagram-three h3{font-size:15px}.hex-line{width:76px;height:7px;display:flex;gap:12px;margin:7px auto}.hex-line i{display:block;flex:1;background:var(--text)}
#brand-name{flex:1}.hexagram-two{grid-template-columns:repeat(2,minmax(0,1fr))}.cast-methods{display:flex;flex-wrap:wrap;gap:12px;border:0;margin:0;padding:0}.cast-methods legend{margin-bottom:6px}.cast-methods label{min-height:44px}.cast-methods input{accent-color:var(--accent)}#taiyi-manual{gap:10px}
</style>
</head>
<body>
  <header id="app-header"><button type="button" id="back" hidden>‹ 返回</button><h1 id="brand-name">观兆问筮</h1><button type="button" id="langbtn" title="Switch language">EN</button></header>
  <main id="workspace">
  <nav id="navigation" aria-label="占卜方式"><div id="mobilebar"></div></nav>
  <section id="configuration">
  <div id="subbar"></div>
  <div id="liurow">
    <div class="liu-trigram-row">
      <label><span id="upper-label">上卦</span>
        <select id="liu-upper">
          <option value="" selected></option>
          <option value="天">乾（天）</option><option value="泽">兑（泽）</option>
          <option value="火">离（火）</option><option value="雷">震（雷）</option>
          <option value="风">巽（风）</option><option value="水">坎（水）</option>
          <option value="山">艮（山）</option><option value="地">坤（地）</option>
        </select>
      </label>
      <label><span id="lower-label">下卦</span>
        <select id="liu-lower">
          <option value="" selected></option>
          <option value="天">乾（天）</option><option value="泽">兑（泽）</option>
          <option value="火">离（火）</option><option value="雷">震（雷）</option>
          <option value="风">巽（风）</option><option value="水">坎（水）</option>
          <option value="山">艮（山）</option><option value="地">坤（地）</option>
        </select>
      </label>
    </div>
    <div class="liu-moving-row">
      <span id="moving-label">动爻</span>
      <div class="moving-options" id="moving-lines">
        <label><input type="checkbox" value="0">初</label>
        <label><input type="checkbox" value="1">二</label>
        <label><input type="checkbox" value="2">三</label>
        <label><input type="checkbox" value="3">四</label>
        <label><input type="checkbox" value="4">五</label>
        <label><input type="checkbox" value="5">上</label>
      </div>
    </div>
  </div>
  <div id="focusrow"></div>
  <div id="traditionalrow"></div>
  <div id="inrow">
    <span id="input-label">输入问题：</span><input id="q" type="text">
  </div>
  <div id="btnrow"><button id="go">占 卜</button><button id="clear">清空</button></div>
  </section>
  <section id="reading" aria-live="polite">
    <h2 id="method-title">综合结果</h2>
    <div id="out" data-empty="占卜结果将在这里显示"></div>
    <div id="resulttools"><button id="histbtn">历史</button><button id="helpbtn">说明</button><button id="copy">复制结果</button></div>
  </section>
  </main>

  <div class="modal" id="hist">
    <div class="modal-box">
      <h3 id="hist-title">历史记录</h3>
      <div class="modal-body" id="hist-body"></div>
      <div class="modal-btns">
        <button id="hist-copy">复制全部</button>
        <button id="hist-clear">清除全部</button>
        <button class="modal-close" id="hist-close">关 闭</button>
      </div>
    </div>
  </div>

  <div class="modal" id="help">
    <div class="modal-box">
      <h3 id="help-title">使用说明</h3>
      <div class="modal-body" id="help-body"></div>
      <div class="modal-btns">
        <button class="modal-close" id="help-ok">确 定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="special-warn">
    <div class="modal-box">
      <h3 id="special-title">特殊塔罗牌说明</h3>
      <div class="modal-body" id="special-body"></div>
      <div class="modal-btns">
        <button class="modal-close" id="special-ok">确 定</button>
      </div>
    </div>
  </div>

  <div class="modal" id="special-unlock">
    <div class="modal-box">
      <h3>开启特殊牌</h3>
      <div>首次在本设备开启需要验证码。</div>
      <input id="special-code" type="password" inputmode="numeric" autocomplete="off" aria-label="验证码">
      <div id="special-code-error" role="alert"></div>
      <div class="modal-btns">
        <button id="special-confirm">确认</button>
        <button class="modal-close" id="special-cancel">取消</button>
      </div>
    </div>
  </div>

  <div class="modal" id="closing-notice" role="dialog" aria-modal="true" aria-labelledby="closing-notice-title" aria-describedby="closing-notice-body">
    <div class="modal-box">
      <h3 id="closing-notice-title"></h3>
      <div class="modal-body" id="closing-notice-body"></div>
      <div class="modal-btns">
        <button type="button" class="modal-close" id="closing-notice-ok"></button>
      </div>
    </div>
  </div>

  <div id="toast">已复制</div>

<script src="data.js"></script>
<script src="qian-en.js"></script>
<script src="traditional-algorithms.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(registration => console.log('SW 注册成功:', registration.scope))
        .catch(err => console.log('SW 注册失败:', err));
    });
  }
</script>
</body>
</html>
