developer_instructions = """
检查目标子项目的静态资源是否全部进入 sw.js 缓存清单且版本已按规则更新。
核对 manifest、作用域、路径大小写、GitHub Pages 子路径和离线回退，不改业务内容。
输出缺失项和可重复的本地验证步骤，未实际验证不得宣称发布可用。
"""
